services:
  - type: web
    name: pacman-maze-generator
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    healthCheckPath: /api/maze
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: mongodb+srv://nour_db:1234@pacmanmaze.pjvjhwy.mongodb.net/?appName=PacmanMaze
