name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run functional tests
      run: |
        pytest tests/test_functional.py -v
        
    - name: Run API tests
      run: |
        pytest tests/test_api.py -v
        
    - name: Run maze characteristics tests
      run: |
        pytest tests/test_maze_characteristics.py -v
        
    - name: Generate coverage report
      run: |
        pip install pytest-cov
        pytest tests/test_functional.py tests/test_api.py tests/test_maze_characteristics.py --cov=Src --cov-report=term-missing
        
  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Deploy to Render
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      run: |
        echo "Deploying to Render..."
        curl -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": false}'
          
    - name: Wait for deployment
      run: sleep 60
      
    - name: Run E2E tests on deployed API
      env:
        API_BASE_URL: ${{ secrets.RENDER_APP_URL }}
      run: |
        pip install -r requirements.txt
        pytest tests/test_e2e.py -v
        
  test-failure-scenario:
    name: Verify Tests Block Bad Code
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run all tests
      run: |
        pytest tests/test_functional.py tests/test_api.py tests/test_maze_characteristics.py -v
      continue-on-error: false
