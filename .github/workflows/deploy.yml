name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        cd Src
        pytest test_maze_generator.py -v
    
    - name: Test maze characteristics
      run: |
        cd Src
        python -c "
from maze_generator import MazeGenerator
from maze_analyzer import MazeAnalyzer

# Générer et tester
gen = MazeGenerator(15, 15)
maze = gen.generate()
analyzer = MazeAnalyzer(maze)
analysis = analyzer.full_analysis()

# Vérifications
assert analysis['connectivity']['is_connected'], 'Maze not connected'
assert analysis['dead_ends']['dead_end_count'] == 0, 'Dead ends found'
assert analysis['pacman_quality']['overall_score'] >= 80, 'Quality too low'

print('✓ All maze characteristics tests passed')
        "

  notify-deploy:
    name: Notify Deployment
    needs: test
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Deployment Ready
      run: |
        echo "Tests passed! Ready for deployment to Render"
        echo "Render will auto-deploy from this commit"
